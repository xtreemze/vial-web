name: Build and deploy Vial Web

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vial-web-${{ github.ref }}
  cancel-in-progress: false

env:
  VIAL_GUI_REPOSITORY: https://github.com/xtreemze/vial-gui.git
  VIAL_GUI_REF: 8fed927834afe4f753d93ea07362423d6ec85f89
  VIA_STACK_REPOSITORY: https://github.com/vial-kb/via-keymap-precompiled.git
  VIA_STACK_REF: 3bcf423c970300722a04113de1d20c901b177e42
  COI_SERVICEWORKER_REF: 7b1d2a092d0d2dd2b7270b6f12f13605de26f214
  CUSTOM_BUILD_ID: xtreemze-halcyon-rgb-profiles-v1

jobs:
  build:
    name: Build Vial Web
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Vial Web
        uses: actions/checkout@v6

      - name: Checkout customized Vial GUI
        shell: bash
        run: |
          git clone "$VIAL_GUI_REPOSITORY" vial-gui
          git -C vial-gui checkout --detach "$VIAL_GUI_REF"

      - name: Verify customized Vial GUI source
        shell: bash
        run: |
          test "$(git -C vial-gui rev-parse HEAD)" = "$VIAL_GUI_REF"
          grep -Fq 'from custom_main_window import CustomMainWindow as MainWindow' vial-gui/src/main/python/webmain.py
          grep -Fq 'class ObservableRGBProfiles' vial-gui/src/main/python/custom_main_window.py
          grep -Fq '"RGB Profiles"' vial-gui/src/main/python/custom_main_window.py
          grep -Fq 'RGB_PROFILE_COMMAND = 0xF0' vial-gui/src/main/python/protocol/rgb_profiles.py

      - name: Checkout VIA compatibility stack
        shell: bash
        run: |
          git clone "$VIA_STACK_REPOSITORY" via-keymap-precompiled
          git -C via-keymap-precompiled checkout --detach "$VIA_STACK_REF"

      - name: Cache Emscripten and compiled dependencies
        id: dependency-cache
        uses: actions/cache@v6
        with:
          path: |
            emsdk
            deps
          key: vial-web-deps-${{ runner.os }}-${{ hashFiles('version.sh', 'fetch-emsdk.sh', 'fetch-deps.sh', 'build-deps.sh', 'patches/**') }}

      - name: Build toolchain dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./fetch-emsdk.sh
          ./fetch-deps.sh
          ./build-deps.sh

      - name: Build customized Vial Web
        shell: bash
        run: |
          cd src
          ./build.sh

      - name: Verify custom extension is packed into the web build
        shell: bash
        run: |
          grep -Fq 'xtreemze Halcyon extensions' src/build/index.html
          grep -aFq 'xtreemze extended RGB profile protocol v1 detected; controls are live.' src/build/main-*.data

      # Vial Web uses Emscripten pthreads. GitHub Pages cannot set the
      # COOP/COEP response headers required for SharedArrayBuffer, so the
      # deployment carries a pinned service-worker shim that establishes
      # cross-origin isolation on this static host.
      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/${COI_SERVICEWORKER_REF}/coi-serviceworker.min.js" \
            --output src/build/coi-serviceworker.js

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          index = Path("src/build/index.html")
          html = index.read_text()
          html = html.replace('href="/icon.png"', 'href="icon.png"')
          marker = "<head>"
          script = '<script src="coi-serviceworker.js"></script>'
          if script not in html:
              html = html.replace(marker, f"{marker}\n    {script}", 1)
          index.write_text(html)

          manifest = {
              "build": os.environ["CUSTOM_BUILD_ID"],
              "features": ["extended-rgb-profiles-v1", "observable-custom-ui"],
              "vial_gui": os.environ["VIAL_GUI_REF"],
              "vial_web": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "via_stack": os.environ["VIA_STACK_REF"],
          }
          Path("src/build/custom-build.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY

          touch src/build/.nojekyll
          test -s src/build/custom-build.json
          grep -Fq "$CUSTOM_BUILD_ID" src/build/custom-build.json

      - name: Upload CI artifact
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: vial-web
          path: src/build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # v4 still embeds upload-artifact@v4 (Node 20). Upstream main has
        # migrated to the Node-24-native upload-artifact@v7 but has not yet
        # published a replacement major, so pin the verified upstream commit.
        uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae
        with:
          path: src/build

  deploy:
    name: Deploy Vial Web
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
