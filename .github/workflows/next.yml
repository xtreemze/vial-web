name: Web-native client

on:
  push:
    branches:
      - feat/web-native-react-scaffold
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  next:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.5.1 --activate
          pnpm --version

      - name: Resolve workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm --dir next typecheck

      - name: Unit tests
        run: pnpm --dir next test

      - name: Production build
        run: pnpm --dir next build

      - name: Emit generated lockfile for bootstrap
        run: |
          echo '---PNPM_LOCKFILE_BEGIN---'
          cat pnpm-lock.yaml
          echo '---PNPM_LOCKFILE_END---'
