name: Vial Web Next

on:
  pull_request:
    branches:
      - main
    paths:
      - "next/**"
      - ".github/workflows/next.yml"
  push:
    branches:
      - main
    paths:
      - "next/**"
      - ".github/workflows/next.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-lockfile:
    name: Bootstrap lockfile
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/web-native-workspace-scaffold'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/web-native-workspace-scaffold

      - name: Check whether lockfile is needed
        id: guard
        shell: bash
        run: |
          if test -f next/pnpm-lock.yaml; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.guard.outputs.needed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        if: steps.guard.outputs.needed == 'true'
        run: npm install --global pnpm@10.17.1

      - name: Generate lockfile
        if: steps.guard.outputs.needed == 'true'
        working-directory: next
        run: pnpm install --lockfile-only

      - name: Commit lockfile
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add next/pnpm-lock.yaml
          git diff --cached --quiet && exit 1
          git commit -m "chore: lock web-native dependencies"
          git push origin HEAD:feat/web-native-workspace-scaffold

  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: next

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.17.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Biome strict policy
        run: pnpm check:ci

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke test
        run: pnpm test:e2e
