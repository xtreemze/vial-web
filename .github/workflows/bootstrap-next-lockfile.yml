name: Bootstrap Vial Web Next lockfile

on:
  push:
    branches:
      - feat/web-native-workspace-scaffold
    paths:
      - "next/package.json"
      - ".github/workflows/bootstrap-next-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'xtreemze/vial-web'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/web-native-workspace-scaffold

      - name: Stop when lockfile already exists
        id: guard
        shell: bash
        run: |
          if test -f next/pnpm-lock.yaml; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.guard.outputs.needed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        if: steps.guard.outputs.needed == 'true'
        run: npm install --global pnpm@10.17.1

      - name: Generate lockfile
        if: steps.guard.outputs.needed == 'true'
        working-directory: next
        run: pnpm install --lockfile-only

      - name: Commit lockfile
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add next/pnpm-lock.yaml
          git diff --cached --exit-code && exit 1 || true
          git commit -m "chore: lock web-native dependencies"
          git push origin HEAD:feat/web-native-workspace-scaffold
