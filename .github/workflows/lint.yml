name: Strict lint policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install root lint toolchain
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install pnpm
        run: npm install --global pnpm@10.17.1

      - name: Install locked native-client dependencies
        working-directory: next
        run: pnpm install --frozen-lockfile

      - name: Run strict lint policy
        run: npm run lint
